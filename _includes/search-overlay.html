<div id="search-overlay" class="search-overlay" data-search-src="{{ base_path }}/search.json" hidden>
  <div class="search-overlay__backdrop" data-search-close></div>
  <div class="search-overlay__panel" role="dialog" aria-modal="true" aria-label="Site search">
    <div class="search-overlay__input-wrap">
      <i class="fas fa-magnifying-glass search-overlay__input-icon" aria-hidden="true"></i>
      <input type="text" id="search-input" class="search-overlay__input" placeholder="Search protocols, publications, software…" autocomplete="off" spellcheck="false">
      <button type="button" class="search-overlay__close" aria-label="Close search" data-search-close>
        <i class="fas fa-xmark" aria-hidden="true"></i>
      </button>
    </div>
    <ul id="search-results" class="search-overlay__results"></ul>
  </div>
</div>
