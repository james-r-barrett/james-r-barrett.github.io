<style>
  .gh-readme-content img { max-width: 100%; height: auto; }
  .gh-readme-content pre { padding: 1em; overflow-x: auto; background-color: var(--bg-surface-alt); border-radius: 6px; }
  .gh-readme-content code { background-color: var(--bg-surface-alt); border-radius: 3px; padding: 0.2em 0.4em; }
  .gh-readme-content pre code { background-color: transparent; padding: 0; }
  .gh-readme-content table { border-collapse: collapse; display: block; width: max-content; max-width: 100%; overflow-x: auto; }
  .gh-readme-content table th, .gh-readme-content table td { border: 1px solid var(--border-color); padding: 0.4em 0.8em; }
  .gh-readme-content blockquote { border-left: 3px solid var(--border-color); margin-left: 0; padding-left: 1em; color: var(--text-muted); }
  .gh-readme-status { color: var(--text-muted); font-style: italic; }
</style>
